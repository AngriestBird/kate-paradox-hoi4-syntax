version: 2

# Keeps the SHA-pinned actions in .github/workflows/ up to date. All action
# bumps land in one grouped PR per run.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - AngriestBird
    groups:
      github-actions:
        patterns:
          - "*"
