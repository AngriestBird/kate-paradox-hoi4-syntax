name: Release

# Builds .zip and .tar.gz bundles of the syntax files. A version tag (e.g.
# v1.0.0) also publishes them as a GitHub Release; manual runs just upload the
# bundles as build artifacts for testing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build archives
        run: |
          VERSION="$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')"
          PKG="hoi4-kate-syntax-${VERSION}"
          mkdir -p "dist/${PKG}"
          cp hoi4.xml hoi4-localisation.xml hoi4-lua.xml \
             install.sh install.ps1 README.md LICENSE "dist/${PKG}/"
          chmod +x "dist/${PKG}/install.sh"
          (
            cd dist
            zip -rq "${PKG}.zip" "${PKG}"
            tar -czf "${PKG}.tar.gz" "${PKG}"
          )
          ls -la dist

      - name: Upload build artifacts
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hoi4-kate-syntax
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        # v3.0.3
        uses: >-
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
